name: Build Phone APK (Release & OTA)

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
      - '*darlopc*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish as a GitHub OTA Release (e.g. v0.7.6-darlopc)'
        required: false
        type: string
      release_notes:
        description: 'Optional release notes for the OTA update'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v5
        with:
          path: vz-pixelplay.jks
          key: pixelplay-persistent-keystore-v1

      - name: Restore or generate persistent signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > vz-pixelplay.jks
            STORE_PASS="${SIGNING_STORE_PASSWORD:-994273}"
            KEY_ALIAS="${SIGNING_KEY_ALIAS:-pixelplay-key}"
            KEY_PASS="${SIGNING_KEY_PASSWORD:-994273}"
          else
            if [ ! -f vz-pixelplay.jks ]; then
              keytool -genkey -v -keystore vz-pixelplay.jks -alias pixelplay-key -keyalg RSA -keysize 4096 -validity 10000                 -storepass 994273 -keypass 994273                 -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"
            fi
            STORE_PASS="994273"
            KEY_ALIAS="pixelplay-key"
            KEY_PASS="994273"
          fi
          echo "storePassword=$STORE_PASS" > keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASS" >> keystore.properties

      - name: Inject Telegram credentials if configured in GitHub Secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            echo "TELEGRAM_API_ID=$TELEGRAM_API_ID" >> local.properties
            echo "TELEGRAM_API_HASH=$TELEGRAM_API_HASH" >> local.properties
          fi

      - name: Build Phone release APK
        run: gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=true

      - name: Verify Phone split APKs and generate SHA-256 checksums
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in             app/build/outputs/apk/release/app-arm64-v8a-release.apk             app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "${apk}.sha256"
          done

      - name: Upload Phone split APK artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlay-phone-release-split-apks
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk.sha256
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish OTA GitHub Release (on tag push or manual release_tag dispatch)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: PixelPlayer ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          body: ${{ inputs.release_notes != '' && inputs.release_notes || 'Actualización OTA de PixelPlayer (Darlopc Mod con Deezload).' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk.sha256
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk.sha256
